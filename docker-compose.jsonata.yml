services:
  serverjsonata:
    # context: .
    image: hrbolek/jsonata-federation:latest
    # build:
    #   context: .
    #   dockerfile: Dockerfile.JSONata
    ports:
      - "8303:3000"
    environment:
      PORT: "3000"
      # ENDPOINTS_CONFIG_PATH: /app/endpoints.json
      FORWARD_HEADERS: cookie,authorization,accept-language,x-request-id

      ENDPOINTS_JSON: >
        [
          {
            "name": "whoami",
            "method": "GET",
            "url": "http://whoami/api",
            "forwardHeaders": true
          }
        ]

    # volumes:
    #   - ./serverjsonata/endpoints.json:/app/endpoints.json:ro

  whoami:
    image: traefik/whoami:latest    

  jsonata-ui:
    image: nginx:alpine
    ports:
      - "8304:80"
    volumes:
      - ./serverjsonata/index.html:/usr/share/nginx/html/index.html:ro
      - ./serverjsonata/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - serverjsonata      